name: Teamsmöte
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "3Teamsmöte" > status.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add status.txt
          git commit -m "Uppdatera status.txt"
          git push
